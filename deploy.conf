WORKER_DIR=.
STAMP_FILES="public/js/config.js public/sw.js public/index.html"
VERIFY_URL=https://rsi-stock-tracker.mishabhi.workers.dev
VERIFY_PATH=/js/config.js
# Stamps each deploy as a commit. It only adds STAMP_FILES, so commit source
# changes *before* deploying.
GIT_COMMIT=1
# The page half of webpush-edge, served from the assets dir (no bundler to
# resolve a bare specifier). client.js imports ./sw.js — copy both.
VENDOR_COPY="node_modules/webpush-edge/src/client.js:public/js/vendor/webpush-edge/client.js node_modules/webpush-edge/src/sw.js:public/js/vendor/webpush-edge/sw.js"
